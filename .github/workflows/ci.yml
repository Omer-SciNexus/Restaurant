name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://nature:nature@localhost:5432/nature_food
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nature
          POSTGRES_PASSWORD: nature
          POSTGRES_DB: nature_food
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nature -d nature_food"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
